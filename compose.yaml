name: infralab
services:
  backend:
    build:
      context: ./backend
      target: runtime
    init: true
    environment:
      DATABASE_PATH: /app/data/tasks.db
    volumes:
      - sqlite-data:/app/data
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      BASE_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
volumes:
  sqlite-data:
