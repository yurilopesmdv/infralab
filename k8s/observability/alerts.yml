groups:
  - name: infralab
    rules:
      - alert: InfraLabApiSemColeta
        expr: (sum(up{job="infralab-api"}) or vector(0)) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Nenhuma réplica da API está sendo coletada com sucesso.
      - alert: InfraLabApiErros5xx
        expr: |
          (sum(rate(infralab_http_requests_total{job="infralab-api",status_code=~"5.."}[2m]))
          / clamp_min(sum(rate(infralab_http_requests_total{job="infralab-api"}[2m])), 0.000001) > 0.05)
          and sum(rate(infralab_http_requests_total{job="infralab-api"}[2m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Mais de 5% das respostas da API são 5xx, com tráfego acima de 1 req/s.
