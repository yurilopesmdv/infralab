apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infralab
resources:
  - prometheus.yaml
  - grafana.yaml
  - loki.yaml
  - alloy.yaml
configMapGenerator:
  - name: loki-config
    files: [loki.yml]
  - name: alloy-config
    files: [config.alloy]
  - name: prometheus-config
    files: [prometheus.yml, alerts.yml]
  - name: grafana-config
    files: [datasources.yaml, dashboards.yaml]
  - name: grafana-dashboards
    files: [infralab.json]
