apiVersion: batch/v1
kind: Job
metadata:
  name: sqlite-to-postgres-v2
  namespace: infralab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: infralab-backend:0.2.1
          imagePullPolicy: Never
          command: [node, dist/migrate-sqlite.js]
          env:
            - name: SQLITE_PATH
              value: /source/tasks.db
            - name: PGHOST
              value: postgres.infralab.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: sqlite-source
              mountPath: /source
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: sqlite-source
          persistentVolumeClaim:
            claimName: sqlite-data
            readOnly: true
