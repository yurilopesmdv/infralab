apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: infralab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: infralab-backend:0.1.0
        imagePullPolicy: Never
        ports:
         - name: http
           containerPort: 3000
        env:
            - name: DATABASE_PATH
              value: /app/data/tasks.db
        volumeMounts:
          - name: sqlite-data
            mountPath: /app/data
        resources:
          requests:
            memory: "64Mi"
            cpu: "150m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data